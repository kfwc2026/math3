<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分數 × 整數 圖示器</title>
<style>
  :root{
    --purple:#7c3aed;
    --ink:#0f172a;
    --muted:#64748b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:30px 16px 60px;
    display:flex;
    justify-content:center;
    background:
      radial-gradient(1100px 550px at 8% -12%, #dbeafe, transparent 65%),
      radial-gradient(900px 500px at 105% 5%, #fce7f3, transparent 60%),
      #f8fafc;
  }
  .app{width:100%;max-width:720px;}

  /* ============ 分數基本樣式 ============ */
  .frac{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    line-height:1;
    margin:0;
    font-weight:800;
    font-size:1em;
    color:inherit;
    flex:0 0 auto;
  }
  .frac .num{
    padding:0 5px 1px;
    border-bottom:1.8px solid currentColor;
    text-align:center;
    min-width:1.15em;
    line-height:1;
  }
  .frac .den{
    padding:1px 5px 0;
    text-align:center;
    min-width:1.15em;
    line-height:1;
  }
  .mixed{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-weight:800;
    flex:0 0 auto;
  }
  .mixed > .whole{font-weight:800;}

  /* ============ 統一的算式 flex 行 ============ */
  .expr-line{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:6px;
    line-height:1;
  }
  .expr-line > span{
    line-height:1;
    white-space:nowrap;
  }

  /* ============ 標題 ============ */
  h1{font-size:clamp(22px,3.6vw,30px);margin:0 0 8px;letter-spacing:.5px;text-align:center;}
  .sub{margin:0 0 24px;color:var(--muted);font-size:14.5px;line-height:1.9;text-align:center;}
  .sub b{color:var(--purple);}

  .card{
    background:#fff;
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 30px -12px rgba(15,23,42,.18), 0 2px 6px -2px rgba(15,23,42,.06);
    border:1px solid rgba(148,163,184,.22);
  }

  /* ============ 題目 + 答案 ============ */
  .expr-card{
    display:flex;flex-direction:column;align-items:center;gap:18px;
    padding:24px 18px;margin-bottom:16px;
  }
  .question-row{
    display:flex;align-items:center;justify-content:center;
    gap:clamp(10px,2.6vw,24px);flex-wrap:wrap;
    padding-bottom:16px; /* 給整數標籤留空間 */
  }

  /* 題目中的輸入框：分子、分母、整數全部統一 60×44 */
  .frac-input{display:flex;flex-direction:column;align-items:center;}
  .frac-input input{
    width:60px;height:44px;text-align:center;
    font-size:21px;font-weight:800;color:var(--ink);
    border:2px solid #cbd5e1;border-radius:12px;background:#fff;
    outline:none;transition:.15s;
    -moz-appearance:textfield;
  }
  .frac-input input::-webkit-outer-spin-button,
  .frac-input input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .frac-input input:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.18);}
  .frac-input input::placeholder{color:#cbd5e1;font-weight:600;}
  .frac-input .line{width:66px;height:3.5px;background:var(--ink);border-radius:2px;margin:4px 0;}

  .frac-input.ans input{background:#f5f3ff;border-color:#c4b5fd;}
  .frac-input.ans input:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.2);}
  .frac-input.ans .line{background:var(--purple);}

  /* 題目中的整數：與分數輸入框同尺寸，垂直居中，標籤絕對定位 */
  .int-input{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    align-self:center;
  }
  .int-input input{
    width:60px;height:44px;text-align:center;
    font-size:21px;font-weight:800;color:var(--ink);
    border:2px solid #cbd5e1;border-radius:12px;background:#fff;
    outline:none;transition:.15s;
    -moz-appearance:textfield;
  }
  .int-input input::-webkit-outer-spin-button,
  .int-input input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .int-input input:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.18);}
  .int-input input::placeholder{color:#cbd5e1;font-weight:600;}
  .int-input .int-label{
    position:absolute;
    top:calc(100% + 4px);
    left:50%;
    transform:translateX(-50%);
    font-size:12px;color:#94a3b8;font-weight:700;letter-spacing:1px;
    white-space:nowrap;pointer-events:none;
  }

  .op{font-size:30px;font-weight:700;color:#64748b;line-height:1;}

  /* ============ 答案區：三種形式 ============ */
  .answers-row{
    display:flex;align-items:stretch;justify-content:center;
    gap:14px;flex-wrap:wrap;
  }
  .ans-card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#faf5ff;
    border:1.5px dashed #ddd6fe;
    border-radius:16px;
    padding:12px 16px;
    min-width:118px;
    transition:.15s;
  }
  .ans-card:hover{border-color:#c4b5fd;background:#f5f3ff;}
  .ans-title{
    font-size:12px;font-weight:800;color:#7c3aed;
    letter-spacing:1px;margin-bottom:8px;white-space:nowrap;
  }
  .ans-card .frac-input input{width:50px;height:38px;font-size:18px;}
  .ans-card .frac-input .line{width:56px;height:3px;}
  .ans-card .int-input input{width:58px;height:44px;font-size:20px;}

  .mixed-ans{display:flex;align-items:center;gap:6px;}
  .mixed-ans .whole-input{
    width:50px;height:38px;text-align:center;
    font-size:18px;font-weight:800;color:var(--ink);
    border:2px solid #c4b5fd;border-radius:10px;background:#f5f3ff;
    outline:none;transition:.15s;
    -moz-appearance:textfield;
  }
  .mixed-ans .whole-input::-webkit-outer-spin-button,
  .mixed-ans .whole-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .mixed-ans .whole-input:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.2);}
  .mixed-ans .whole-input::placeholder{color:#c4b5fd;font-weight:600;}

  .ans-hint{
    text-align:center;font-size:12.5px;color:#a78bfa;
    font-weight:700;margin-top:-4px;line-height:1.6;
  }

  /* ============ 按鈕 ============ */
  .actions{display:flex;gap:12px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:12px;padding:12px 28px;
    font-size:16px;font-weight:800;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .btn-primary{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
    box-shadow:0 6px 16px -6px rgba(99,102,241,.7);
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 20px -8px rgba(99,102,241,.8);}
  .btn-primary:active{transform:translateY(0);}
  .btn-ghost{background:#eef2ff;color:#4338ca;}
  .btn-ghost:hover{background:#e0e7ff;}

  /* ============ 回饋 ============ */
  .feedback{
    display:none;margin:0 0 18px;padding:14px 18px;border-radius:13px;
    font-weight:700;font-size:15px;line-height:1.8;
  }
  .feedback.show{display:block;animation:pop .22s ease;}
  @keyframes pop{from{transform:scale(.97);opacity:0;}to{transform:scale(1);opacity:1;}}
  .feedback.ok{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
  .feedback.err{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;}
  .feedback.warn{background:#fef3c7;color:#b45309;border:1px solid #fcd34d;}
  .feedback b{font-weight:900;}
  .fb-expr{
    margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(15,23,42,.15);
    font-size:16px;
  }

  /* ============ 圖示區 ============ */
  .fig-card{
    display:flex;flex-direction:column;gap:10px;margin:0 auto;
  }
  .legend{
    display:flex;flex-wrap:wrap;gap:14px;justify-content:center;
    font-size:13px;color:#475569;margin-top:8px;
  }
  .sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;}
  .sw.purple{background:rgba(124,58,237,.35);border:1.5px solid var(--purple);}
  .sw.white{background:#fff;border:1.5px solid #475569;}

  .stage-title{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:13.5px;
    font-weight:700;
    color:#475569;
    margin:8px 0 6px;
    line-height:1.2;
    text-align:center;
  }
  .stage-title b{color:#6d28d9;}
  .stage-title .circled{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;background:#ede9fe;color:#6d28d9;
    font-size:12px;font-weight:900;flex:0 0 auto;
  }
  .stage{margin:0;}

  .merge-bar{
    display:flex;align-items:center;justify-content:center;gap:7px;
    margin:14px 0 4px;padding:8px 0;
    font-size:13.5px;font-weight:800;color:#8b5cf6;
    border-top:1px dashed #ddd6fe;border-bottom:1px dashed #ddd6fe;
    animation:fadeIn .4s ease both;
  }
  .merge-bar .arrow{
    display:inline-block;font-size:17px;line-height:1;
    animation:bounce 1.4s ease-in-out infinite;
  }
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  .hint-box{
    text-align:center;font-size:13.5px;color:#94a3b8;
    background:#f8fafc;border:1px dashed #cbd5e1;
    border-radius:12px;padding:22px 16px;margin-top:16px;
    font-weight:600;line-height:1.8;
    animation:fadeIn .3s ease both;
  }
  .hint-box b{color:#a78bfa;}

  .answer-line{
    display:none;
    background:#f5f3ff;border:1px solid #ddd6fe;
    border-radius:12px;
    padding:16px 18px;
    margin:14px auto 0;
    max-width:100%;
    font-size:16px;
    font-weight:800;
    color:#4c1d95;
  }
  .answer-line.show{display:block;animation:pop .3s ease .35s both;}

  /* ============ 答案圖動畫 ============ */
  @keyframes cellIn{
    0%{opacity:0;transform:scale(.3);}
    70%{opacity:1;transform:scale(1.1);}
    100%{opacity:1;transform:scale(1);}
  }
  .cell{
    transform-box:fill-box;transform-origin:center;
    animation:cellIn .42s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes labelIn{from{opacity:0;}to{opacity:1;}}
  .label-anim{animation:labelIn .32s ease both;}

  @media (max-width:520px){
    .ans-card{min-width:96px;padding:10px 12px;}
    .ans-card .frac-input input{width:44px;height:34px;font-size:16px;}
    .ans-card .frac-input .line{width:50px;}
    .mixed-ans .whole-input{width:44px;height:34px;font-size:16px;}
    .ans-card .int-input input{width:52px;height:38px;font-size:18px;}
  }
</style>
</head>
<body>
<div class="app">
  <h1>分數 × 整數 圖示器</h1>
  <p class="sub">
    輸入一個分數和一個整數。<b>上方</b>會畫出整數個數的長方形，每個都是同一個分數。<br>
    答案可以填在<b>分數</b>、<b>帶分數</b>或<b>整數</b>其中一個格子（只要填一種）。<br>
    答對時，下方會以<b>動畫</b>顯示答案圖。
  </p>

  <!-- 題目 + 答案輸入 -->
  <div class="card expr-card">
    <!-- 題目 -->
    <div class="question-row">
      <div class="frac-input">
        <input id="a" type="number" min="1" max="12" inputmode="numeric" placeholder="?" aria-label="分數的分子">
        <div class="line"></div>
        <input id="b" type="number" min="1" max="12" inputmode="numeric" placeholder="?" aria-label="分數的分母">
      </div>
      <div class="op">×</div>
      <div class="int-input">
        <input id="n" type="number" min="1" max="12" inputmode="numeric" placeholder="?" aria-label="整數">
        <span class="int-label">整數</span>
      </div>
      <div class="op">=</div>
    </div>

    <!-- 答案區 -->
    <div class="answers-row">
      <div class="ans-card">
        <div class="ans-title">分數</div>
        <div class="frac-input ans">
          <input id="ansN" type="number" min="1" max="999" inputmode="numeric" placeholder="?" aria-label="答案分數的分子">
          <div class="line"></div>
          <input id="ansD" type="number" min="1" max="999" inputmode="numeric" placeholder="?" aria-label="答案分數的分母">
        </div>
      </div>

      <div class="ans-card">
        <div class="ans-title">帶分數</div>
        <div class="mixed-ans">
          <input id="whole" class="whole-input" type="number" min="0" max="99" inputmode="numeric" placeholder="整" aria-label="帶分數的整數部分">
          <div class="frac-input ans">
            <input id="bNum" type="number" min="1" max="99" inputmode="numeric" placeholder="?" aria-label="帶分數的分子">
            <div class="line"></div>
            <input id="bDen" type="number" min="1" max="99" inputmode="numeric" placeholder="?" aria-label="帶分數的分母">
          </div>
        </div>
      </div>

      <div class="ans-card">
        <div class="ans-title">整數</div>
        <div class="int-input">
          <input id="intAns" type="number" min="1" max="999" inputmode="numeric" placeholder="?" aria-label="答案的整數">
        </div>
      </div>
    </div>

    <div class="ans-hint">三種形式選一種填寫即可</div>
  </div>

  <!-- 操作按鈕 -->
  <div class="actions">
    <button id="checkBtn" class="btn btn-primary" type="button">檢查答案</button>
    <button id="resetBtn" class="btn btn-ghost" type="button">重設</button>
  </div>

  <!-- 回饋 -->
  <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

  <!-- 圖示區 -->
  <div class="card fig-card">
    <div id="figure"></div>
    <div id="answerLine" class="answer-line"></div>
    <div class="legend">
      <span><i class="sw purple"></i>塗色部分（每小格是 1 份）</span>
      <span><i class="sw white"></i>未塗色部分</span>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const $ = id => document.getElementById(id);
  const aEl=$('a'), bEl=$('b'), nEl=$('n');
  const ansN=$('ansN'), ansD=$('ansD');
  const wholeEl=$('whole'), bNumEl=$('bNum'), bDenEl=$('bDen');
  const intAnsEl=$('intAns');
  const figure=$('figure'), fb=$('feedback');
  const checkBtn=$('checkBtn'), resetBtn=$('resetBtn');
  const answerLine=$('answerLine');

  const MAXV = 12;
  let solved = false;

  const FONT = "'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif";

  const gcd = (x, y) => y ? gcd(y, x % y) : x;

  /* ============ 讀取數值 ============ */
  function readInt(el, min, max){
    const raw = el.value.trim();
    if (raw === '') return null;
    const v = parseInt(raw, 10);
    if (!Number.isFinite(v) || v < min) return null;
    return Math.min(v, max);
  }
  function topicNum(el){ return readInt(el, 1, MAXV); }

  function getTopic(){
    let a = topicNum(aEl), b = topicNum(bEl), n = topicNum(nEl);
    if (a === null || b === null || n === null) return null;
    a = Math.min(a, b);
    return { a, b, n };
  }

  function normalizeTopicInputs(){
    const a = topicNum(aEl), b = topicNum(bEl), n = topicNum(nEl);
    if (a !== null) aEl.value = a;
    if (b !== null) bEl.value = b;
    if (n !== null) nEl.value = n;
    if (a !== null && b !== null && a > b) aEl.value = b;
  }

  /* ============ 產生 HTML 分數 ============ */
  function htmlFraction(num, den){
    return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
  }
  function htmlFracOrInt(num, den){
    if (den === 1) return `<span>${num}</span>`;
    return htmlFraction(num, den);
  }
  function htmlMixed(whole, num, den){
    if (num === 0) return `<span>${whole}</span>`;
    return `<span class="mixed"><span class="whole">${whole}</span>${htmlFraction(num, den)}</span>`;
  }

  /* ============ 建立算式列 ============ */
  function buildExprLine(parts){
    return `<div class="expr-line">${parts.join('')}</div>`;
  }
  function opSpan(s){ return `<span>${s}</span>`; }
  function intSpan(n){ return `<span>${n}</span>`; }

  /* ============ SVG 分數 ============ */
  function svgFraction(cx, cy, num, den, color, fontSize){
    const fs = fontSize;
    const gap = fs * 0.75;
    const numStr = String(num), denStr = String(den);
    const maxLen = Math.max(numStr.length, denStr.length);
    const lineHalf = Math.max(fs * 0.55, maxLen * fs * 0.34);
    const strokeW = Math.max(1.3, fs * 0.1);

    let out = '';
    out += `<text x="${cx.toFixed(1)}" y="${(cy - gap).toFixed(1)}"
              text-anchor="middle" dominant-baseline="central"
              font-size="${fs.toFixed(1)}" font-weight="800" fill="${color}"
              font-family="${FONT}">${numStr}</text>`;
    out += `<line x1="${(cx - lineHalf).toFixed(1)}" y1="${cy.toFixed(1)}"
              x2="${(cx + lineHalf).toFixed(1)}" y2="${cy.toFixed(1)}"
              stroke="${color}" stroke-width="${strokeW.toFixed(2)}" stroke-linecap="round"/>`;
    out += `<text x="${cx.toFixed(1)}" y="${(cy + gap).toFixed(1)}"
              text-anchor="middle" dominant-baseline="central"
              font-size="${fs.toFixed(1)}" font-weight="800" fill="${color}"
              font-family="${FONT}">${denStr}</text>`;
    return out;
  }
  function svgFracOrInt(cx, cy, num, den, color, fontSize){
    if (den === 1){
      return `<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}"
                text-anchor="middle" dominant-baseline="central"
                font-size="${fontSize.toFixed(1)}" font-weight="800" fill="${color}"
                font-family="${FONT}">${num}</text>`;
    }
    return svgFraction(cx, cy, num, den, color, fontSize);
  }

  /* ============ 回饋訊息 ============ */
  function showFB(type, text, exprParts){
    let html = '';
    if (text) html += `<div>${text}</div>`;
    if (exprParts && exprParts.length){
      html += `<div class="fb-expr">${buildExprLine(exprParts)}</div>`;
    }
    fb.className = 'feedback show ' + type;
    fb.innerHTML = html;
  }
  function hideFB(){
    fb.className = 'feedback';
    fb.innerHTML = '';
  }

  /* ============ 空白圖板 ============ */
  function blankHTML(){
    const S = 340;
    return `<svg viewBox="-10 -10 ${S + 20} ${S + 20}" width="100%"
              style="display:block;max-width:400px;margin:0 auto" role="img"
              aria-label="尚未輸入分數與整數">
      <rect x="0" y="0" width="${S}" height="${S}" rx="8"
            fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="9 7"/>
      <text x="${S/2}" y="${S/2 - 12}" text-anchor="middle"
            font-size="18" font-weight="700" fill="#94a3b8"
            font-family="${FONT}">請輸入分數與整數</text>
      <text x="${S/2}" y="${S/2 + 18}" text-anchor="middle"
            font-size="14" font-weight="500" fill="#cbd5e1"
            font-family="${FONT}">圖示會在這裡出現</text>
    </svg>`;
  }

  /* ============ 上段：n 個 a/b 長方形 ============ */
  function buildProductsSVG(a, b, n){
    const colMap = {1:1,2:2,3:3,4:2,5:3,6:3,7:4,8:4,9:3,10:4,11:4,12:4};
    const cols   = colMap[n] || 4;
    const rows   = Math.ceil(n / cols);
    const gap    = 12;
    const availW = 420;

    let rectW = (availW - (cols - 1) * gap) / cols;
    if (n === 1) rectW = Math.min(rectW, 200);
    const rectH  = Math.max(32, rectW * 0.55);

    const fs = Math.max(11, Math.min(14, rectW / 6));
    const labelH = Math.max(34, fs * 2.6 + 8);
    const rowH   = rectH + labelH;

    const totalW = cols * rectW + (cols - 1) * gap;
    const totalH = rows * rowH + (rows - 1) * gap;

    const vbW  = Math.max(totalW + 20, availW);
    const vbH  = totalH + 20;
    const offX = (vbW - totalW) / 2;
    const offY = 10;

    const cellW  = rectW / b;
    const colorW = a * cellW;

    let svg = `<svg viewBox="0 0 ${vbW} ${vbH}" width="100%"
                 style="display:block;max-width:${vbW}px;margin:0 auto"
                 role="img" aria-label="${n} 個 ${a}/${b} 的長方形">`;

    for (let i = 0; i < n; i++){
      const r = Math.floor(i / cols);
      const c = i % cols;
      const itemsInRow = Math.min(cols, n - r * cols);
      const rowW   = itemsInRow * rectW + (itemsInRow - 1) * gap;
      const startX = offX + (totalW - rowW) / 2;
      const x = startX + c * (rectW + gap);
      const y = offY + r * (rowH + gap);

      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}"
                width="${rectW.toFixed(1)}" height="${rectH.toFixed(1)}" fill="#ffffff"/>`;
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}"
                width="${colorW.toFixed(2)}" height="${rectH.toFixed(1)}"
                fill="#7c3aed" opacity="0.45"/>`;

      svg += `<g stroke="#475569" stroke-width="0.9" opacity="0.5">`;
      for (let j = 1; j < b; j++){
        const lx = (x + j * cellW).toFixed(2);
        svg += `<line x1="${lx}" y1="${y.toFixed(1)}"
                  x2="${lx}" y2="${(y + rectH).toFixed(1)}"/>`;
      }
      svg += `</g>`;

      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}"
                width="${colorW.toFixed(2)}" height="${rectH.toFixed(1)}"
                fill="none" stroke="#7c3aed" stroke-width="1.6"/>`;
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}"
                width="${rectW.toFixed(1)}" height="${rectH.toFixed(1)}"
                fill="none" stroke="#0f172a" stroke-width="1.8"/>`;

      const cx = x + rectW / 2;
      const labelCY = y + rectH + labelH / 2;
      svg += svgFracOrInt(cx, labelCY, a, b, '#6d28d9', fs);
    }

    svg += `</svg>`;
    return svg;
  }

  /* ============ 下段：答案圖（動畫） ============ */
  function buildAnswerSVG(p, q, animate){
    const G = Math.floor(p / q);
    const R = p % q;
    const N = G + (R > 0 ? 1 : 0);
    if (N === 0) return '';

    const gap    = 16;
    const availW = 420;

    let cols;
    if (N <= 1)      cols = 1;
    else if (N <= 2) cols = 2;
    else if (N <= 6) cols = 3;
    else             cols = 4;

    let rectW = (availW - (cols - 1) * gap) / cols;
    rectW = Math.min(rectW, 170);
    const rectH = Math.max(40, Math.min(rectW * 0.55, 82));

    const fs = Math.max(11, Math.min(15, rectW / 5));
    const labelH = Math.max(36, fs * 2.6 + 8);

    const rows  = Math.ceil(N / cols);
    const totalW = cols * rectW + (cols - 1) * gap;
    const totalH = rows * (rectH + labelH) + (rows - 1) * gap;

    const vbW  = Math.max(totalW + 20, availW);
    const vbH  = totalH + 20;
    const offX = (vbW - totalW) / 2;
    const offY = 10;

    const cellW = rectW / q;

    const totalCells = p;
    const stepSec = animate ? Math.min(0.09, 2.2 / Math.max(totalCells, 1)) : 0;

    let svg = `<svg viewBox="0 0 ${vbW} ${vbH}" width="100%"
                 style="display:block;max-width:${vbW}px;margin:0 auto"
                 role="img" aria-label="答案圖：每 ${q} 格裝成一個長方形 = 1">`;

    let cellIndex = 0;

    for (let i = 0; i < N; i++){
      const r = Math.floor(i / cols);
      const c = i % cols;
      const itemsInRow = Math.min(cols, N - r * cols);
      const rowW   = itemsInRow * rectW + (itemsInRow - 1) * gap;
      const startX = offX + (totalW - rowW) / 2;
      const x = startX + c * (rectW + gap);
      const y = offY + r * (rectH + labelH + gap);

      const isLast = (R > 0 && i === G);
      const filled = isLast ? R : q;

      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}"
                width="${rectW.toFixed(1)}" height="${rectH.toFixed(1)}"
                fill="#ffffff" rx="2"/>`;

      for (let j = 0; j < filled; j++){
        const cx = x + j * cellW;
        const delay = animate ? (cellIndex * stepSec).toFixed(3) : '0';
        const cls = animate ? 'cell' : '';
        svg += `<rect class="${cls}" x="${cx.toFixed(2)}" y="${y.toFixed(1)}"
                  width="${cellW.toFixed(2)}" height="${rectH.toFixed(1)}"
                  fill="#7c3aed" fill-opacity="0.5"
                  style="animation-delay:${delay}s"/>`;
        cellIndex++;
      }

      if (q > 1){
        for (let j = 1; j < q; j++){
          const lx = (x + j * cellW).toFixed(2);
          svg += `<line x1="${lx}" y1="${y.toFixed(1)}"
                    x2="${lx}" y2="${(y + rectH).toFixed(1)}"
                    stroke="#475569" stroke-width="0.9" opacity="0.45"/>`;
        }
      }

      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}"
                width="${rectW.toFixed(1)}" height="${rectH.toFixed(1)}"
                fill="none"
                stroke="${isLast ? '#7c3aed' : '#0f172a'}"
                stroke-width="${isLast ? 2.2 : 1.8}" rx="2"/>`;

      const cx = x + rectW / 2;
      const labelCY = y + rectH + labelH / 2;
      const lastCellOfGroup = (filled > 0 ? cellIndex - 1 : 0);
      const labelDelay = animate
        ? (lastCellOfGroup * stepSec + 0.12).toFixed(3)
        : '0';

      if (isLast){
        svg += `<g class="label-anim" style="animation-delay:${labelDelay}s">`;
        svg += svgFraction(cx, labelCY, R, q, '#c026d3', fs);
        svg += `</g>`;
      } else {
        svg += `<text class="label-anim" style="animation-delay:${labelDelay}s"
                  x="${cx.toFixed(1)}" y="${labelCY.toFixed(1)}"
                  text-anchor="middle" dominant-baseline="central"
                  font-size="${fs.toFixed(1)}" font-weight="800" fill="#6d28d9"
                  font-family="${FONT}">1</text>`;
      }
    }

    svg += `</svg>`;
    return svg;
  }

  /* ============ 繪圖主控 ============ */
  function render(){
    const t = getTopic();
    answerLine.className = 'answer-line';
    answerLine.innerHTML = '';

    if (!t){
      figure.innerHTML = blankHTML();
      return;
    }

    const { a, b, n } = t;
    const p = a * n, q = b;
    const g = gcd(p, q), rp = p / g, rq = q / g;

    let html = '';

    /* ① 乘法過程圖 */
    html += `<div class="stage-title">
      <span class="circled">1</span>
      <span>畫出</span>
      <span><b>${n}</b></span>
      <span>個</span>
      ${htmlFracOrInt(a, b)}
      <span>的長方形</span>
    </div>`;
    html += `<div class="stage">${buildProductsSVG(a, b, n)}</div>`;

    /* ② 答對才顯示動畫答案圖 */
    if (solved){
      html += `<div class="merge-bar">
        <span class="arrow">↓</span> 把每個長方形的塗色小格裝進新長方形
      </div>`;
      html += `<div class="stage-title">
        <span class="circled">2</span>
        <span>答案圖：每個長方形 =</span>
        <span><b>1</b></span>
        <span>，分成</span>
        <span><b>${q}</b></span>
        <span>格，塗色</span>
        <span><b>${p}</b></span>
        <span>格</span>
      </div>`;
      html += `<div class="stage">${buildAnswerSVG(p, q, true)}</div>`;
    } else {
      html += `<div class="hint-box">
        填上你的答案後，按「檢查答案」。<br>
        答對時，這裡會以<b>動畫</b>顯示答案圖。
      </div>`;
    }

    figure.innerHTML = html;

    /* 答對後在圖下方顯示完整算式 */
    if (solved){
      const parts = [];
      parts.push(htmlFracOrInt(a, b));
      parts.push(opSpan('×'));
      parts.push(intSpan(n));
      parts.push(opSpan('='));
      parts.push(htmlFracOrInt(p, q));
      if (g > 1){
        parts.push(opSpan('='));
        parts.push((rq === 1) ? intSpan(rp) : htmlFraction(rp, rq));
      }
      if (rq > 1 && rp > rq){
        const wh = Math.floor(rp / rq), rem = rp % rq;
        parts.push(opSpan('='));
        parts.push(htmlMixed(wh, rem, rq));
      }
      answerLine.innerHTML = buildExprLine(parts);
      answerLine.classList.add('show');
    }
  }

  /* ============ 評估三種答案 ============ */
  function evaluateAnswers(t){
    const { a, b, n } = t;
    const p = a * n, q = b;
    const results = [];

    /* ---- 分數 ---- */
    const fnRaw = ansN.value.trim(), fdRaw = ansD.value.trim();
    if (fnRaw !== '' || fdRaw !== ''){
      const fn = readInt(ansN, 1, 999);
      const fd = readInt(ansD, 1, 999);
      if (fn === null || fd === null){
        results.push({type:'err', field:'分數', msg:'分數的分子和分母都要填，且為正整數。'});
      } else {
        const equal = (fn * q === fd * p);
        const reduced = gcd(fn, fd) === 1;
        if (equal && reduced){
          results.push({type:'ok', field:'分數'});
        } else if (equal){
          results.push({type:'warn', field:'分數', msg:'分數的數值正確，但還沒約簡至最簡分數。'});
        } else {
          results.push({type:'err', field:'分數'});
        }
      }
    }

    /* ---- 帶分數 ---- */
    const wRaw = wholeEl.value.trim();
    const bnRaw = bNumEl.value.trim();
    const bdRaw = bDenEl.value.trim();
    if (wRaw !== '' || bnRaw !== '' || bdRaw !== ''){
      const w = readInt(wholeEl, 0, 99);
      const bn = readInt(bNumEl, 1, 99);
      const bd = readInt(bDenEl, 1, 99);
      const hasWhole = (wRaw !== '');
      const hasFrac  = (bnRaw !== '' || bdRaw !== '');

      if (hasWhole && !hasFrac){
        if (w === null){
          results.push({type:'err', field:'帶分數', msg:'帶分數的整數部分格式不正確。'});
        } else if (p % q === 0 && w === p / q){
          results.push({type:'ok', field:'帶分數'});
        } else {
          results.push({type:'err', field:'帶分數', msg:'答案不是整數，請填寫分數部分。'});
        }
      } else if (hasFrac){
        if (bn === null || bd === null){
          results.push({type:'err', field:'帶分數', msg:'帶分數的分子和分母都要填，且為正整數。'});
        } else {
          const wholePart = (hasWhole && w !== null) ? w : 0;
          const numTotal = wholePart * bd + bn;
          const equal = (numTotal * q === bd * p);
          const isProper = bn < bd;
          const reduced = gcd(bn, bd) === 1;
          if (equal && isProper && reduced){
            results.push({type:'ok', field:'帶分數'});
          } else if (equal){
            let msg = '帶分數的數值正確，但';
            if (!isProper) msg += '分數部分必須是真分數（分子小於分母）';
            if (!isProper && !reduced) msg += '，且';
            if (!reduced) msg += '分數部分需要約簡至最簡';
            msg += '。';
            results.push({type:'warn', field:'帶分數', msg});
          } else {
            results.push({type:'err', field:'帶分數'});
          }
        }
      }
    }

    /* ---- 整數 ---- */
    const iRaw = intAnsEl.value.trim();
    if (iRaw !== ''){
      const iv = readInt(intAnsEl, 1, 999);
      if (iv === null){
        results.push({type:'err', field:'整數', msg:'整數格式不正確。'});
      } else if (p % q === 0 && iv === p / q){
        results.push({type:'ok', field:'整數'});
      } else {
        results.push({type:'err', field:'整數', msg:'答案不是這個整數。'});
      }
    }

    return results;
  }

  /* ============ 檢查答案 ============ */
  function check(){
    const t = getTopic();
    if (!t){
      showFB('err', '請先在上方輸入完整的分數和整數。');
      return;
    }

    const results = evaluateAnswers(t);

    if (results.length === 0){
      showFB('err', '請在「分數」、「帶分數」或「整數」其中一個格子填上答案。');
      return;
    }

    const { a, b, n } = t;
    const p = a * n, q = b;
    const g = gcd(p, q), rp = p / g, rq = q / g;

    const okResult   = results.find(r => r.type === 'ok');
    const warnResult = results.find(r => r.type === 'warn');

    if (okResult){
      solved = true;

      let answerParts;
      if (rq === 1){
        answerParts = intSpan(rp);
      } else if (rp > rq){
        const wh = Math.floor(rp / rq), rem = rp % rq;
        answerParts = htmlMixed(wh, rem, rq);
      } else {
        answerParts = htmlFraction(rp, rq);
      }

      const formName = okResult.field;
      showFB('ok',
        `✓ 正確！你是用「${formName}」形式答對的。`,
        [
          htmlFracOrInt(a, b),
          opSpan('×'),
          intSpan(n),
          opSpan('='),
          answerParts
        ]
      );
      render();
    } else if (warnResult){
      solved = false;
      showFB('warn', warnResult.msg + '<br>請約簡或修正後，再按一次「檢查答案」。');
      render();
    } else {
      solved = false;
      showFB('err', '✗ 答案不正確，請再試一次。<br>提示：先算出分子 × 整數，分母不變，再化為最簡。');
      render();
    }
  }

  /* ============ 重設 ============ */
  function reset(){
    [aEl, bEl, nEl, ansN, ansD, wholeEl, bNumEl, bDenEl, intAnsEl].forEach(el => { el.value = ''; });
    solved = false;
    hideFB();
    render();
    aEl.focus();
  }

  /* ============ 事件 ============ */
  function bindTopic(el, max){
    el.addEventListener('input', () => {
      const v = parseInt(el.value, 10);
      if (Number.isFinite(v) && v > max) el.value = max;
      solved = false;
      hideFB();
      render();
    });
    el.addEventListener('change', () => { normalizeTopicInputs(); render(); });
    el.addEventListener('blur',   () => { normalizeTopicInputs(); render(); });
  }
  bindTopic(aEl, MAXV);
  bindTopic(bEl, MAXV);
  bindTopic(nEl, MAXV);

  [ansN, ansD, wholeEl, bNumEl, bDenEl, intAnsEl].forEach(el => {
    el.addEventListener('input', () => {
      solved = false;
      hideFB();
      render();
    });
  });

  checkBtn.addEventListener('click', check);
  resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT'){
      e.preventDefault();
      check();
    }
  });

  /* ============ 初始化 ============ */
  render();
})();
</script>
</body>
</html>
